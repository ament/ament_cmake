## CMinx settings used by rosdoc2 (see the cminx builder in rosdoc2.yaml).

input:
  ## Only document functions and macros that have a CMinx doc comment (#[[[ ... #]]).
  include_undocumented_function: false
  include_undocumented_macro: false

  ## These files contain no CMinx doc comments, so would generate empty pages.
  ## Patterns are gitignore-style and are matched against absolute paths.
  exclude_filters:
    - "*_package_hook.cmake"
    - "environment/"
    - "**/environment_hooks/ament_generate_package_environment.cmake"
    - "**/core/all.cmake"
    - "**/core/assert_file_exists.cmake"
    - "**/core/python.cmake"
